<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estúdio de Tatuagem | Login</title>
    <link rel="stylesheet" href="css/estilo.css" />
  </head>
  <body class="pagina-login">
    <main class="cartao-login">
      <div class="marca">ET</div>
      <p class="subtitulo">ESTÚDIO DE TATUAGEM</p>
      <h1>Estúdio de Tatuagem</h1>
      <p class="texto-fraco">Gestão de clientes, projetos e sessões.</p>
      <form id="formularioLogin" class="formulario-vertical">
        <label
          >E-mail<input
            id="email"
            type="email"
            value="tatuador@estudio.com"
            required
        /></label>
        <label
          >Senha<input id="senha" type="password" value="123456" required
        /></label>
        <button class="botao botao-principal" type="submit">
          Entrar no painel
        </button>
        <p id="erroLogin" class="erro-formulario" role="alert"></p>
      </form>
      <p class="dica">Acesso de demonstração: tatuador@estudio.com / 123456</p>
    </main>
    <script src="js/app.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
