<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estúdio de Tatuagem | Clientes</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script src="js/app.js"></script>
</head>
<body>
  <div class="estrutura-aplicacao">
    <script>document.write(montarMenu('Clientes', 'clientes'));</script>

    <div class="grade-dupla">
      <section class="painel">
        <h2 id="tituloFormulario">Novo cliente</h2>
        <form id="formularioCliente" class="grade-formulario">
          <input type="hidden" id="idCliente">
          <label>Nome completo <input id="nomeCliente" required></label>
          <label>CPF <input id="cpfCliente" placeholder="000.000.000-00" required></label>
          <label>Telefone <input id="telefoneCliente" required></label>
          <label>E-mail <input id="emailCliente" type="email" required></label>
          <button class="botao botao-principal" type="submit">Salvar cliente</button>
          <button class="botao botao-discreto" type="button" id="cancelarEdicao">Limpar</button>
        </form>
      </section>

      <section class="painel">
        <div class="cabecalho-painel">
          <h2>Base de clientes</h2>
          <div class="barra-ferramentas">
            <input id="campoBuscaCliente" placeholder="Buscar nome, e-mail ou telefone">
            <button class="botao botao-suave" id="botaoBusca">Buscar</button>
          </div>
        </div>
        <div class="tabela-container">
          <table>
            <thead>
              <tr><th>Nome</th><th>CPF</th><th>Contato</th><th>Ações</th></tr>
            </thead>
            <tbody id="linhasClientes"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  </div>
  <script src="js/clientes.js"></script>
</body>
</html>
