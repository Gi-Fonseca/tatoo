<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estúdio de Tatuagem | Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <div class="brand-mark">ET</div>
    <p class="eyebrow">ESTÚDIO DE TATUAGEM</p>
    <h1>Estúdio de Tatuagem</h1>
    <p class="muted">Gestão de clientes, projetos e sessões.</p>
    <form id="loginForm" class="stack-form">
      <label>E-mail<input id="email" type="email" value="admin@estudio.com" required></label>
      <label>Senha<input id="password" type="password" value="123456" required></label>
      <button class="btn btn-primary" type="submit">Entrar no painel</button>
      <p id="loginError" class="form-error" role="alert"></p>
    </form>
    <p class="hint">Acesso de demonstração: admin@estudio.com / 123456</p>
  </main>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
