<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estúdio de Tatuagem | Projetos</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><div class="app-layout"><script>document.write(shell('Projetos de tatuagem','projects'))</script><section class="panel"><div class="panel-head"><h2>Projetos cadastrados</h2><button class="btn btn-primary" id="newProject">Novo projeto</button></div><form id="projectForm" class="form-grid hidden"><input type="hidden" id="projectId"><label>Nome do projeto<input id="projectName" required></label><label>Cliente<select id="projectClient" required></select></label><label>Estilo<input id="projectStyle" placeholder="Fine line, blackwork..."></label><label>Status<select id="projectStatus"><option>Em planejamento</option><option>Aprovado</option><option>Concluído</option></select></label><label class="full">Descrição<textarea id="projectDescription" required></textarea></label><button class="btn btn-primary" type="submit">Salvar projeto</button><button class="btn btn-ghost" type="button" id="cancelProject">Cancelar</button></form><div class="table-wrap"><table><thead><tr><th>Projeto</th><th>Cliente</th><th>Estilo</th><th>Status</th><th>Ações</th></tr></thead><tbody id="projectRows"></tbody></table></div></section></main></div><script src="js/projetos.js"></script></body></html>
