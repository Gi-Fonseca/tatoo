<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estúdio de Tatuagem | Clientes</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><div class="app-layout"><script>document.write(shell('Clientes','clients'))</script><div class="grid-2"><section class="panel"><h2 id="formTitle">Novo cliente</h2><form id="clientForm" class="form-grid"><input type="hidden" id="clientId"><label>Nome completo<input id="clientName" required></label><label>CPF<input id="clientCpf" placeholder="000.000.000-00" required></label><label>Telefone<input id="clientPhone" required></label><label>E-mail<input id="clientEmail" type="email" required></label><button class="btn btn-primary full" type="submit">Salvar cliente</button><button class="btn btn-ghost full" type="button" id="cancelEdit">Limpar</button></form></section><section class="panel"><div class="panel-head"><h2>Base de clientes</h2><div class="toolbar"><input id="searchClient" placeholder="Buscar nome, e-mail ou telefone"><button class="btn btn-soft" id="searchBtn">Buscar</button></div></div><div class="table-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Contato</th><th>Ações</th></tr></thead><tbody id="clientRows"></tbody></table></div></section></div></main></div><script src="js/clientes.js"></script></body></html>
