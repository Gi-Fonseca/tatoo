<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estúdio de Tatuagem | Sessões</title><link rel="stylesheet" href="css/style.css"><script src="js/app.js"></script></head><body><div class="app-layout"><script>document.write(shell('Sessões e agendamentos','sessions'))</script><section class="panel"><div class="panel-head"><h2>Agenda do estúdio</h2><button class="btn btn-primary" id="newSession">Nova sessão</button></div><form id="sessionForm" class="form-grid hidden"><input type="hidden" id="sessionId"><label>Projeto<select id="sessionProject" required></select></label><label>Data e hora<input id="sessionDate" type="datetime-local" required></label><label>Duração (minutos)<input id="sessionDuration" type="number" min="30" step="30" value="120" required></label><label>Status<select id="sessionStatus"><option>Agendada</option><option>A confirmar</option><option>Concluída</option></select></label><button class="btn btn-primary" type="submit">Salvar sessão</button><button class="btn btn-ghost" type="button" id="cancelSession">Cancelar</button></form><div class="table-wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Projeto</th><th>Duração</th><th>Status</th><th>Ações</th></tr></thead><tbody id="sessionRows"></tbody></table></div></section></main></div><script src="js/sessoes.js"></script></body></html>
